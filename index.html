<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Anh Tuấn AOV</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Be Vietnam Pro',sans-serif;
}

body{
    background:#eaf6ff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:35px;
    padding:35px 25px;
    box-shadow:0 8px 30px rgba(0,0,0,0.08);
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    border-radius:28px;
    object-fit:cover;
    margin-bottom:20px;
}

h1{
    font-size:42px;
    font-weight:700;
    margin-bottom:18px;
}

.desc{
    color:#777;
    font-size:22px;
    line-height:1.6;
    margin-bottom:35px;
}

.telegram-btn{
    width:100%;
    height:85px;
    border:none;
    border-radius:28px;
    background:linear-gradient(90deg,#0b8fff,#16b8ff);
    color:white;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 12px 25px rgba(0,140,255,.3);
    transition:.2s;
}

.telegram-btn:active{
    transform:scale(.98);
}

.page2{
    display:none;
}

.title2{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-size:34px;
    font-weight:700;
    margin-bottom:35px;
}

.info-box{
    background:#eef3f8;
    padding:35px 20px;
    border-radius:30px;
    font-size:26px;
    color:#56617a;
    font-weight:600;
    margin-bottom:40px;
}

.random-btn{
    width:100%;
    height:95px;
    border:none;
    border-radius:30px;
    background:linear-gradient(90deg,#536dff,#8b42d8);
    color:white;
    font-size:30px;
    font-weight:700;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(98,78,255,.25);
}

.countdown{
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:75px;
    border-radius:22px;
    background:white;
    color:#6876ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:700;
}

.acc-box{
    margin-top:30px;
    background:#f5f7fb;
    border-radius:25px;
    padding:25px;
    display:none;
}

.acc-box p{
    font-size:22px;
    margin:12px 0;
    font-weight:600;
}

.footer{
    margin-top:30px;
    color:#999;
    font-size:20px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="card" id="page1">

    <img src="https://i.imgur.com/jQ9Xw6x.jpeg" class="logo">

    <h1>Anh Tuấn AOV</h1>

    <div class="desc">
        Tham gia nhóm telegram để cập nhật tin tức mới nhất từ Anh Tuấn AOV
    </div>

    <button class="telegram-btn" onclick="joinTelegram()">
        ✈️ Tham Gia Telegram
    </button>

    <div class="footer">
        © 2026 Anh Tuấn AOV
    </div>

</div>


<!-- PAGE 2 -->
<div class="card page2" id="page2">

    <div class="title2">
        🎮 Tặng Acc Liên Quân
    </div>

    <div class="info-box">
        ℹ️ Nhấn nút để nhận tài khoản
    </div>

    <button class="random-btn" id="getAccBtn">
        ⚡ Nhận acc
        <div class="countdown" id="timer">0</div>
    </button>

    <div class="acc-box" id="accBox">
        <p id="username"></p>
        <p id="password"></p>
    </div>

</div>


<script>
const TELEGRAM_LINK = "https://t.me/yourgroup";
const WAIT_TIME = 60;

const page1 = document.getElementById("page1");
const page2 = document.getElementById("page2");

function joinTelegram(){

    localStorage.setItem("joinedTelegram","1");

    window.open(TELEGRAM_LINK,"_blank");

    setTimeout(()=>{
        page1.style.display = "none";
        page2.style.display = "block";
    },2000);
}


const getBtn = document.getElementById("getAccBtn");
const timerEl = document.getElementById("timer");
const accBox = document.getElementById("accBox");

let cooldown = false;

async function getRandomAccount(){

    if(cooldown) return;

    cooldown = true;

    // đọc file accs.json
    const res = await fetch("accs.json");
    const accounts = await res.json();

    // random
    const random =
    accounts[Math.floor(Math.random()*accounts.length)];

    document.getElementById("username").innerHTML =
        "👤 Tài khoản: " + random.username;

    document.getElementById("password").innerHTML =
        "🔑 Mật khẩu: " + random.password;

    accBox.style.display = "block";

    let time = WAIT_TIME;
    timerEl.innerText = time;

    const interval = setInterval(()=>{

        time--;
        timerEl.innerText = time;

        if(time <= 0){
            clearInterval(interval);
            timerEl.innerText = "0";
            cooldown = false;
        }

    },1000);

}

getBtn.addEventListener("click",getRandomAccount);
</script>

</body>
</html>
